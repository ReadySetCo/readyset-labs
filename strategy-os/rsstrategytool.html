<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ready Set — Strategy OS</title>
<style>
:root{
  --bg:#f5f5f7; --card:#fff; --card2:#f6f7f9; --line:#e3e6eb; --line2:#d0d5dd;
  --ink:#1d1d1f; --ink2:#55575c; --ink3:#8a8f98;
  --accent:#8a63d2; --accent-soft:#f1ecfa;
  --good:#0a7d33; --good-soft:#e7f5ec; --warn:#b58900; --warn-soft:#fdf6dd; --bad:#d64545; --bad-soft:#fdeaea;
  --hm0:#eef1f5; --hm1:#cde9d6; --hm2:#7fc99a; --hm3:#2e9e5b; --hmw1:#f6cfcf; --hmw2:#e88f8f;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06); --r:14px;
}
body.dark{
  --bg:#101114; --card:#1b1d22; --card2:#22252b; --line:#2c2f36; --line2:#3a3e47;
  --ink:#f2f3f5; --ink2:#b6bac2; --ink3:#7b808a;
  --accent:#a78fe0; --accent-soft:#292040;
  --good:#4bc07a; --good-soft:#15281c; --warn:#d9b216; --warn-soft:#2b2510; --bad:#e46a6a; --bad-soft:#331a1a;
  --hm0:#22252b; --hm1:#1c3a27; --hm2:#26663f; --hm3:#37a763; --hmw1:#4a2323; --hmw2:#7a3030;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:14.5px; line-height:1.5; transition:background .25s,color .25s;}
button{font-family:inherit;}
.topbar{position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px; padding:14px 26px; background:color-mix(in srgb,var(--bg) 85%,transparent); backdrop-filter:blur(14px); border-bottom:1px solid var(--line);}
.topbar .logo{font-weight:800; letter-spacing:-.02em; font-size:16px; cursor:pointer;}
.crumb{font-size:13px; color:var(--ink3);}
.theme-t{margin-left:auto; border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:999px; padding:5px 14px; font-size:13px; font-weight:600; cursor:pointer;}
main{max-width:1150px; margin:0 auto; padding:28px 26px 90px;}
.btn{border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 16px; font-size:13.5px; font-weight:600; cursor:pointer; transition:all .15s;}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.primary:hover{filter:brightness(1.1); color:#fff;}
.btn.big{padding:12px 26px; font-size:15px; border-radius:12px;}
.btn.tiny{padding:3px 10px; font-size:12px; border-radius:7px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
/* HOME */
.hero{text-align:center; padding:9vh 20px 5vh;}
.hero h1{font-size:clamp(34px,5.5vw,58px); font-weight:800; letter-spacing:-.03em; line-height:1.1;}
.hero p{margin-top:14px; font-size:19px; color:var(--ink2);}
.brand-row{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:6vh;}
.brand-card{width:220px; padding:34px 20px; border-radius:22px; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); cursor:pointer; text-align:center; transition:transform .18s, box-shadow .18s;}
.brand-card:hover{transform:translateY(-4px); box-shadow:0 14px 40px rgba(0,0,0,.12);}
.brand-card .bname{font-size:21px; font-weight:800; letter-spacing:-.02em;}
.brand-card .bsub{font-size:12.5px; color:var(--ink3); margin-top:6px;}
.brand-card .bstat{margin-top:14px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;}
/* FLOW */
.legend{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px 22px; color:var(--ink2); font-size:14px; box-shadow:var(--shadow); margin-bottom:34px;}
.flow{display:flex; align-items:stretch; gap:0; justify-content:center; flex-wrap:wrap;}
.node{width:220px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px 18px; text-align:center; cursor:pointer; box-shadow:var(--shadow); transition:transform .15s;}
.node:hover{transform:translateY(-3px);}
.node .nicon{font-size:26px;}
.node .nname{font-weight:800; margin-top:8px; font-size:15.5px;}
.node .ndesc{font-size:12px; color:var(--ink3); margin-top:4px; min-height:34px;}
.badge{display:inline-block; margin-top:12px; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:3px 12px; border-radius:999px;}
.badge.ok{background:var(--good-soft); color:var(--good);}
.badge.no{background:var(--warn-soft); color:var(--warn);}
.arrow{display:flex; align-items:center; font-size:22px; color:var(--ink3); padding:0 10px;}
/* SECTIONS */
.shead{display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap;}
.shead h2{font-size:24px; font-weight:800; letter-spacing:-.02em;}
.shead .acts{margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:16px;}
.card-h{display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.card-h h3{font-size:15.5px; font-weight:700;}
.card-b{padding:16px 18px;}
.hint{font-size:12px; color:var(--ink3);}
table.et{width:100%; border-collapse:collapse; font-size:13px;}
table.et th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink3); padding:7px 8px; border-bottom:1px solid var(--line);}
table.et td{padding:3px 4px; border-bottom:1px solid var(--line); vertical-align:top;}
table.et input, table.et textarea{width:100%; border:1px solid transparent; background:transparent; color:var(--ink); padding:6px 7px; font-size:13px; border-radius:7px; font-family:inherit; resize:vertical;}
table.et input:focus, table.et textarea:focus{outline:none; border-color:var(--accent); background:var(--card2);}
.rowdel{border:none; background:none; color:var(--ink3); cursor:pointer; font-size:13px;}
.rowdel:hover{color:var(--bad);}
.vtag{font-size:10.5px; font-weight:800; padding:1px 8px; border-radius:999px; white-space:nowrap;}
.v-Validated{background:var(--good-soft); color:var(--good);}
.v-Testing{background:var(--warn-soft); color:var(--warn);}
.v-NotTested,.v-Not.Tested{background:var(--card2); color:var(--ink3); border:1px dashed var(--line2);}
.f label{display:block; font-size:12px; font-weight:700; color:var(--ink2); margin-bottom:3px;}
.f input,.f textarea,.f select{width:100%; border:1px solid var(--line2); border-radius:9px; background:var(--card2); color:var(--ink); padding:8px 10px; font-size:13.5px; font-family:inherit;}
.f textarea{min-height:64px; resize:vertical;}
.f input:focus,.f textarea:focus,.f select:focus{outline:none; border-color:var(--accent);}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px 26px;}
@media(max-width:840px){.grid2{grid-template-columns:1fr;}}
.savebar{position:sticky; bottom:14px; display:flex; gap:10px; justify-content:center; z-index:40;}
.savebar .inner{background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:999px; padding:8px 12px; display:flex; gap:8px; align-items:center;}
/* ROADMAP BUILDER */
.rb-wrap{display:grid; grid-template-columns:280px 1fr; gap:16px;}
@media(max-width:900px){.rb-wrap{grid-template-columns:1fr;}}
.chips{display:flex; flex-wrap:wrap; gap:7px;}
.chip{border:1px solid var(--line2); background:var(--card2); color:var(--ink); font-size:12.5px; font-weight:600; padding:4px 12px; border-radius:999px; cursor:pointer; transition:all .12s;}
.chip:hover{border-color:var(--accent);}
.chip.sel{background:var(--accent); border-color:var(--accent); color:#fff;}
.sentence{font-size:16px; line-height:1.9; background:var(--card2); border-radius:12px; padding:14px 18px;}
.sentence .tk{font-weight:800; color:var(--accent); border-bottom:2px dashed var(--accent);}
.sentence .ph{color:var(--ink3); border-bottom:2px dashed var(--line2); font-weight:600;}
.lane{border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:10px; background:var(--card);}
.lane .lt{font-size:14px;}
.lane .lm{font-size:12px; color:var(--ink3); margin-top:3px;}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:16px;}
.tile{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; box-shadow:var(--shadow);}
.tile .v{font-size:24px; font-weight:800; letter-spacing:-.02em;}
.tile .l{font-size:11.5px; color:var(--ink3); font-weight:600;}
/* HEATMAP */
.bfthumb{width:62px; height:62px; object-fit:cover; border-radius:9px; border:1px solid var(--line2); flex:none; background:var(--card2); display:block;}
.bfnothumb{display:flex; align-items:center; justify-content:center; font-size:9.5px; color:var(--ink3); text-align:center; font-weight:600;}
.bfrow{display:flex; gap:14px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--line);}
.bfrow:last-child{border-bottom:none;}
.bfmeta{min-width:104px; text-align:right;}
.bfsp{font-size:16.5px; font-weight:800; letter-spacing:-.01em;}
.bfmain{flex:1; min-width:0;}
.bfname{font-size:13.5px; font-weight:700; margin-bottom:2px; word-break:break-word;}
.bfctl{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:7px;}
.trend{display:flex; gap:8px; align-items:flex-end; height:132px;}
.tcol{flex:1; min-width:44px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; height:100%; cursor:pointer; border-radius:9px; padding:4px 2px; transition:background .15s;}
.tcol:hover{background:var(--card2);}
.tcol.sel{background:var(--card2); outline:2px solid var(--ink3);}
.tcol .tv{font-size:11.5px; font-weight:800; color:var(--ink2); margin-bottom:3px;}
.tcol .tbar{width:100%; max-width:46px; border-radius:6px 6px 2px 2px; transition:opacity .15s;}
.tcol .tl{font-size:11px; font-weight:700; color:var(--ink3); margin-top:5px;}
.hm-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:end; margin-bottom:12px;}
.hm-controls .f{min-width:150px;}
.hm{overflow-x:auto;}
.hm table{border-collapse:separate; border-spacing:3px;}
.hm th{font-size:11px; font-weight:700; color:var(--ink2); padding:4px 8px; text-align:left; max-width:120px; vertical-align:bottom;}
.hm td{min-width:92px; height:52px; border-radius:9px; text-align:center; font-size:12px; font-weight:700; padding:3px 6px; cursor:default;}
.hm td.unt{background:var(--hm0); border:1.5px dashed var(--line2); color:var(--ink3); font-weight:500;}
.hm td.opp{border:1.5px dashed var(--good); color:var(--good); background:var(--hm0);}
.hm td.leg{background:repeating-linear-gradient(45deg,var(--hm0),var(--hm0) 6px,var(--hm1) 6px,var(--hm1) 12px); border:1.5px solid var(--line2); color:var(--ink2); font-weight:600;}
.fbrow{border:1px solid var(--line); border-radius:9px; padding:8px 12px; margin-bottom:6px; font-size:12.5px; background:var(--card2);}
/* SHEET */
.sheet-scroll{overflow-x:auto; border:1px solid var(--line); border-radius:10px;}
table.sheet{border-collapse:collapse; font-size:11.5px; white-space:nowrap;}
table.sheet th{position:sticky; top:0; background:var(--card2); padding:6px 9px; border:1px solid var(--line); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink2);}
table.sheet td{padding:0; border:1px solid var(--line);}
table.sheet td input{border:1px solid transparent; background:transparent; color:var(--ink); font:inherit; padding:5px 8px; min-width:96px; width:100%; border-radius:0;}
table.sheet td input:focus{outline:none; border-color:var(--accent); background:var(--card2);}
table.sheet td.wide input{min-width:230px;}
/* BRIEF */
.brief{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:26px 30px; margin-bottom:18px;}
.brief .spark{font-size:13px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:10px; padding:10px 14px; margin-bottom:16px;}
.brief h3{font-size:18px; letter-spacing:-.01em; margin-bottom:6px;}
.brief .lead{font-size:15.5px; line-height:1.8;}
.brief .lead b{color:var(--accent);}
.brief h5{font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3); margin:16px 0 5px; border-bottom:1px solid var(--line); padding-bottom:3px;}
.brief ul{margin-left:18px; font-size:13.5px;}
.glossary{font-size:12.5px; color:var(--ink2); border-top:1px dashed var(--line2); margin-top:18px; padding-top:12px;}
/* brief workspace (creative fills it) */
.wk{width:100%; border-collapse:collapse; margin-top:8px;}
.wk th{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink3); border:1px solid var(--line); padding:7px 10px; background:var(--card2); text-align:left; width:50%;}
.wk td{border:1px solid var(--line); padding:0; vertical-align:top;}
.wk .cell{min-height:78px; padding:9px 11px; outline:none; font-size:13.5px; white-space:pre-wrap;}
.wk .cell:focus{background:var(--card2);}
.wk .cell:empty::before{content:attr(data-ph); color:var(--ink3); font-size:12px;}
.wk.small .cell{min-height:52px;}
/* Creative Direction Statement */
.cdsline{font-size:17px; line-height:2.3;}
.cdsline input{width:140px; border:1.5px dashed var(--accent); background:var(--accent-soft); border-radius:8px; padding:2px 8px; font-size:15px; font-weight:700; color:var(--accent); text-align:center; cursor:text; font-family:inherit;}
.cdsline input.neg{border-color:var(--bad); background:var(--bad-soft); color:var(--bad);}
.cdsline input:focus{outline:none; border-style:solid; background:var(--card);}
.cdsline input::placeholder{color:var(--ink3); font-weight:500; font-size:12.5px;}
.cds-prev{margin-top:6px; padding:12px 16px; background:var(--card2); border-left:3px solid var(--accent); border-radius:0 10px 10px 0; font-style:italic; color:var(--ink2); font-size:14.5px;}
.cname:empty::before{content:attr(data-ph); color:var(--ink3); font-weight:500; font-size:14px;}
.picker{display:flex; flex-wrap:wrap; gap:8px;}
.pick{display:flex; align-items:center; gap:8px; border:1px solid var(--line2); border-radius:10px; padding:8px 14px; cursor:pointer; font-size:13px; background:var(--card2);}
.pick input{accent-color:var(--accent);}
body.print-single .brief{display:none;}
body.print-single .brief.print-target{display:block;}
.glossary dt{font-weight:800; color:var(--ink);}
.glossary dd{margin:0 0 6px 0;}
.modal-bg{position:fixed; inset:0; background:rgba(10,12,18,.5); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:50px 20px; overflow-y:auto;}
.modal-bg.open{display:flex;}
.modal{background:var(--card); color:var(--ink); border-radius:16px; max-width:640px; width:100%; padding:26px; box-shadow:0 24px 80px rgba(0,0,0,.35);}
.alert{display:flex; gap:10px; padding:9px 13px; border-radius:9px; margin-bottom:7px; font-size:12.5px; align-items:baseline;}
.alert.warn{background:var(--warn-soft);}
.alert.bad{background:var(--bad-soft);}
/* ── export hub (step 4) ── */
.tabs{display:flex; gap:5px; flex-wrap:wrap;}
.tab{border:1px solid var(--line2); background:var(--card2); color:var(--ink2); border-radius:9px; padding:6px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
.tab.on{background:var(--ink); border-color:var(--ink); color:var(--bg);}
.rlmodal{position:fixed; inset:0; z-index:120; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; padding:26px;}
.mbox{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 12px 48px rgba(0,0,0,.3); width:min(1120px,100%); max-height:88vh; overflow:auto;}
.mtable{overflow:auto; max-height:210px; border:1px solid var(--line); border-radius:10px;}
.mtable table.k{min-width:1500px;}
.mtable th{position:sticky; top:0; background:var(--card); white-space:nowrap;}
.mtable td{white-space:nowrap; font-size:11.5px;}
.onepv{width:100%; height:440px; border:1px solid var(--line2); border-radius:10px; background:#fff; margin-top:4px;}
.tsvbox{width:100%; height:150px; margin-top:10px; border:1px solid var(--line2); background:var(--card2); color:var(--ink2); border-radius:9px; padding:8px 10px; font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; white-space:pre; overflow:auto;}
/* ── the line map (step 3) ── */
.tubewrap{overflow-x:auto; padding:2px 0;}
.tube{display:block; min-width:1180px; color:var(--ink);}
.tube .ln{fill:none; stroke-linecap:round; stroke-linejoin:round; stroke-width:7; transition:opacity .12s;}
.tube.hl .ln{opacity:.13;} .tube.hl .ln.on{opacity:1;}
.tube.hl .st{opacity:.2;} .tube.hl .st.on{opacity:1;}
.tube .st{transition:opacity .12s;}
.tube text{font:600 10.5px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:currentColor; stroke:var(--card); stroke-width:3.6px; paint-order:stroke fill; stroke-linejoin:round;}
.tube text.sub{font-weight:500; font-size:9.5px; fill:var(--ink3);}
.tube text.cn{font-weight:700; font-size:9.5px;}
.tube text.dl{font-weight:800; font-size:11px; fill:#fff; stroke:none;}
.tube .ic{fill:var(--card); stroke:currentColor; stroke-width:2.6;}
.tube .sn{stroke:var(--card); stroke-width:2.4;}
/* ── roadmap thesis + plan (step 2) ── */
.thesis{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--card)),var(--card));}
.thesis .tin{width:100%; border:none; background:none; color:var(--ink); font:inherit; font-size:19px; font-weight:800; padding:0; outline:none;}
.thesis .tin::placeholder{color:var(--ink3); font-weight:700;}
.thesis .sin{width:100%; border:none; background:none; color:var(--ink2); font:inherit; font-size:13.5px; padding:0; outline:none; resize:vertical; min-height:38px;}
.arrowrow{display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin-top:10px;}
.arrowrow input{width:100%; border:1px solid var(--line2); background:var(--card2); color:var(--ink); border-radius:9px; padding:7px 10px; font:inherit; font-size:12.5px;}
.plan{padding-top:12px; padding-bottom:12px;}
.planrow{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;}
.pf{flex:0 0 auto; min-width:120px;}
.pf label{display:block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink3); margin-bottom:3px;}
.pf input{width:100%; border:1px solid var(--line2); background:var(--card2); color:var(--ink); border-radius:9px; padding:6px 9px; font:inherit; font-size:12.5px;}
.pcap{flex:1; min-width:220px;}
.capnum{font-size:19px; font-weight:800; line-height:1.1;}
.capnum span{font-size:13px; font-weight:600; color:var(--ink3);}
.capnum.bad{color:var(--bad);} .capnum.good{color:var(--good);}
/* ── roadmap composer (from roadmap-lab, step 1) ── */
.tk.act,.ph.act{outline:2px solid var(--accent); outline-offset:2px;}
.ph{cursor:pointer;}
.secs{display:flex; flex-direction:column; gap:6px;}
.sec{border:1px solid var(--line); border-radius:11px; overflow:hidden;}
.sec.open{border-color:var(--accent);}
.sech{display:flex; align-items:center; gap:9px; padding:7px 11px; cursor:pointer; background:var(--card2);}
.sec.open .sech{background:color-mix(in srgb,var(--accent) 9%,var(--card2));}
.secn{font-size:10.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3); width:64px; flex:none;}
.secv{font-size:12.5px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.secv.em{font-weight:500; color:var(--ink3);}
.seca{font-size:11px; color:var(--ink3);}
.seccount{background:var(--accent); color:#fff; font-size:10px; font-weight:800; border-radius:6px; padding:1px 6px;}
.secb{padding:10px 11px; border-top:1px solid var(--line);}
.batch{background:var(--accent); color:#fff; font-size:11px; font-weight:800; border-radius:7px; padding:3px 9px;}
table.k{width:100%; border-collapse:collapse; font-size:12.5px;}
table.k th{text-align:left; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--ink3); font-weight:700; padding:6px 8px; border-bottom:1px solid var(--line);}
table.k td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.k tr:last-child td{border-bottom:none;}
table.k.specs td{padding:5px 6px;}
table.k.specs select{width:100%; border:1px solid var(--line2); background:var(--card2); color:var(--ink); border-radius:8px; padding:5px 7px; font:inherit; font-size:12px;}
.lanehead{display:flex; align-items:center; gap:7px; margin-bottom:5px;}

    pls:null, /* corrida del motor PLS (segundo camino de ingesta — ver ══ PLS engine runs ══) */
    perf:{reports:def.perf?[JSON.parse(JSON.stringify(PERF_SEED.report))]:[], rows:def.perf?PERF_SEED.rows.slice():[], unparsed:def.perf?PERF_SEED.unparsed.slice():[]}};
}
function loadBrand(code){
  const def=BRAND_DEFS.find(b=>b.code===code);
  try{const s=JSON.parse(lsGet('sos-v1-'+code)||'null'); if(s){B=s;
    if(!B.layer.cds)B.layer.cds={feel:['','',''],never:['','',''],custom:''};
    if(B.pls===undefined)B.pls=null; /* estado guardado antes del merge PLS */
    /* a previously-saved EMPTY layer must not shadow a newly ingested seed */
    const L=B.layer, empty=!L.product.name&&!L.ctps.length&&!L.segments.length&&!L.angles.length;
    if(empty&&def.seed){B.layer=JSON.parse(JSON.stringify(def.seed)); save();}
    /* taxonomy migration (Sep 6): when the seed moved to client-persona CTPs + demographic segments
       (detectable by casting[] on seed segments) and the saved layer still has the old lists,
       adopt the new CTPs/segments — everything else (product, CDS, angles, perf, roadmap, briefs) is kept. */
    if(def.seed&&def.seed.segments[0]&&def.seed.segments[0].casting&&B.layer.segments.length&&!B.layer.segments[0].casting){
      B.layer.ctps=JSON.parse(JSON.stringify(def.seed.ctps));
      B.layer.segments=JSON.parse(JSON.stringify(def.seed.segments)); save();}
    /* seed-heal: a saved layer shadows the seed, so persona insights added to the seed later
       (e.g. the Creative Library PDF descriptions, Sep 6) never reach it. Fill ONLY empty
       fields from the matching seed persona — anything the strategist typed is never touched. */
    if(def.seed&&(def.seed.ctps||[]).length){
      let healed=false;
      B.layer.ctps.forEach(c=>{
        const sp=def.seed.ctps.find(x=>(c.tag&&x.tag===c.tag)||x.name===c.name); if(!sp)return;
        if(!c.insight&&sp.insight){c.insight=sp.insight; healed=true;}
        if((!c.clothingPersona||!c.clothingPersona.length)&&(sp.clothingPersona||[]).length){c.clothingPersona=sp.clothingPersona.slice(); healed=true;}
      });
      if(healed)save();
    }
    return;}}catch(e){}
  B=blankBrand(def);
}

/* ══════════ taxonomy resolvers (client personas + demographic segments) ══════════
   Segments are the variable you test. Casting is who you film. Old rows carry the old
   taxonomy → they resolve to a SUGGESTED persona (legacyCtp/legacyMacro) and count as
   legacy context, not as validated tests, until re-tagged (B.perfRetag). */
function personaOf(v){ /* resolve a CTP string (name | tag | legacy name) to a persona row */
  if(!v)return null; const C=B.layer.ctps;
  return C.find(c=>c.name===v||c.tag===v)||C.find(c=>(c.legacyCtp||[]).includes(v))||null;
}
function segOf(v){ /* resolve a Segment string (name | alias) to a segment row */
  if(!v)return null; const S=B.layer.segments;
  return S.find(s=>s.name===v)||S.find(s=>(s.aliases||[]).includes(v))||null;
}
function resolveDims(dims,key){ /* → {ctp,segment,angle,funnel,legacy} in the CURRENT taxonomy */
  const usesTags=B.layer.ctps.some(c=>c.tag);
  if(!usesTags)return {...dims,legacy:false};
  const rt=(B.perfRetag||{})[key];
  if(rt)return {...dims,ctp:rt.ctp,segment:rt.segment,legacy:false,retagged:true};
  const direct=B.layer.ctps.find(c=>c.name===dims.ctp||c.tag===dims.ctp);
  const seg=segOf(dims.segment);
  if(direct&&(seg||!dims.segment))return {...dims,ctp:direct.name,segment:seg?seg.name:'unassigned',legacy:false};
  /* legacy row: suggest persona via legacyCtp, then legacyMacro as second signal */
  const viaCtp=B.layer.ctps.find(c=>(c.legacyCtp||[]).includes(dims.ctp));
  const viaMacro=B.layer.ctps.find(c=>(c.legacyMacro||[]).includes(dims.segment));
  const p=viaCtp||viaMacro;
  return {...dims,ctp:p?p.name:(dims.ctp||'unresolved legacy'),segment:seg?seg.name:'unassigned',legacy:true,rawCtp:dims.ctp,rawSeg:dims.segment};
}

/* ══════════ PERIOD SCOPE — everything in Performance is read FOR A PERIOD ══════════
   One CPA averaged over six months hides the story (June ran at $492, July at $410). The scope object
   is the single source of truth for the module: which rows are in play, and which account totals the
   benchmark is computed from. Every consumer (benchmark tile, heat map, winners, trend) takes a scope. */
let PER={sel:'all'};
const perfDS=()=>{const def=BRAND_DEFS.find(b=>b.code===B.code);
  if(def&&def.perf)return PERF_MONTHS;
  return (typeof PERF_BRAND_MONTHS!=='undefined'&&PERF_BRAND_MONTHS[B.code])||null;};
const monthsOf=()=>{const ds=perfDS(); return ds?ds.months:[];};
function periodOpts(){
  const ms=monthsOf(), o=[];
  if(ms.length){
    o.push({id:'all',lbl:`All time · ${ms[0].lbl.replace(/ \(.*\)/,'')} – ${ms[ms.length-1].lbl}`});
    ms.slice().reverse().forEach(m=>o.push({id:m.m,lbl:m.lbl}));
  }
  if(B.perf.rows.length)o.push({id:'looker',lbl:'Looker snapshot · '+((B.perf.reports[0]&&B.perf.reports[0].dates)||'loaded reports')});
  return o;
}
/* resolve a raw `p:` ad-name tag to a persona row (null when it isn't a persona at all) */
function personaFromAdTag(raw){
  if(!raw)return null; const k=String(raw).trim().toLowerCase();
  if(NOT_A_PERSONA.includes(k))return null;
  const name=PERSONA_AD_TAGS[k];
  if(name)return B.layer.ctps.find(c=>c.name===name)||null;
  const norm=x=>String(x).toLowerCase().replace(/^the /,'').trim();
  return personaOf(raw)||B.layer.ctps.find(c=>norm(c.name)===norm(k))||null;
}
/* → {id,label,rows,acctSp,acctPu,months,partial,note} · rows normalised to {label,spend,purch,d,c,pTag} */
function perfScope(){
  const opts=periodOpts();
  if(!opts.some(o=>o.id===PER.sel))PER.sel=opts.length?opts[0].id:'looker';
  return scopeFor(PER.sel);
}
/* the month BEFORE a given period — the comparison that turns a number into a movement */
function prevPeriodOf(id){
  const ms=monthsOf(); const i=ms.findIndex(m=>m.m===id);
  return i>0?ms[i-1].m:null;
}
function scopeFor(id){
  const ms=monthsOf();
  if(id==='looker'||!ms.length){
    const all=[...B.perf.rows,...B.perf.unparsed];
    return {id:'looker',src:'looker',
      label:(B.perf.reports[0]&&B.perf.reports[0].dates)||'loaded reports', partial:false, months:[],
      rows:B.perf.rows.map(r=>({label:r.label,spend:r.spend||0,purch:r.purch||0,d:r.d,c:r.c,pTag:null})),
      acctSp:all.reduce((a,r)=>a+(r.spend||0),0), acctPu:all.reduce((a,r)=>a+(r.purch||0),0),
      note:'Looker export — every RS concept in the range, benchmark includes BAU.'};
  }
  const sel=id==='all'?ms:ms.filter(m=>m.m===id);
  const rows=[];
  sel.forEach(m=>m.rows.forEach(r=>rows.push({label:r.n,spend:r.sp,purch:r.pu,d:r.d,c:r.c,pTag:r.p||null,k:r.k||null,th:r.th||null,ai:r.ai||null,month:m.m})));
  return {id,src:'motion',
    label:id==='all'?`${ms[0].lbl.replace(/ \(.*\)/,'')} – ${ms[ms.length-1].lbl}`:(sel[0]?sel[0].lbl:id),
    partial:sel.some(m=>m.partial), months:sel, rows,
    acctSp:sel.reduce((a,m)=>a+m.sp,0), acctPu:sel.reduce((a,m)=>a+m.pu,0),
    note:'Motion — benchmark from the full account; rows are the top 25 ads of each month.'};
}

/* ══════════ PERFORMANCE (heat map) ══════════ */
let HM={x:'angle',y:'ctp',f:{ctp:'',segment:'',angle:'',funnel:'',phase:''}};
function perfCombos(scope){
  /* aggregate the scope's rows into testable combinations and attach dimensions.
     Two naming conventions live in production and never overlap:
       · RS_D##_C###  → dimensions come from the Strategy Sheet (PERF_SEED.dims)
       · | p: … |     → the persona is written INTO the ad name, so it joins directly
     Everything else is unmapped: real spend that can't teach us anything yet. */
  const sc=scope||perfScope(), map={};
  sc.rows.forEach(r=>{
    let key,dims=null;
    if(r.d!=null&&r.c!=null){key=r.d+'-'+r.c; dims=PERF_SEED.dims[key]||null;}
    else if(r.pTag){
      const p=personaFromAdTag(r.pTag);
      if(p){key='p:'+(p.tag||p.name)+'|'+r.label; dims={ctp:p.name,segment:'',angle:'',funnel:'',hyp:'',viaAdName:r.pTag};}
      else key='u:'+r.label; /* `p:sub` and friends — a product tag, not a persona */
    } else key='u:'+r.label;
    if(!map[key])map[key]={...r,key,dims};
    else{map[key].spend+=r.spend; map[key].purch+=r.purch;}
  });
  const list=Object.values(map);
  list.forEach(c=>{
    /* a human confirmed this ad in the backfill worklist — that beats every automatic resolution */
    const bt=(B.perfTags||{})[c.key];
    if(bt&&!c.dims)c.dims={ctp:'',segment:'',angle:'',funnel:'',hyp:'',viaHuman:true};
    if(c.dims)c.res=resolveDims(c.dims,c.key);
    if(bt){c.res=c.res||{legacy:false};
      if(bt.ctp)c.res.ctp=bt.ctp;
      if(bt.segment)c.res.segment=bt.segment;
      if(bt.angle)c.res.angle=bt.angle;
      c.res.legacy=false; c.res.human=true;}
    /* ad-name dimensions ride along on every row that has them — including rows whose CTP/Segment
       came from the Strategy Sheet, so Persona × Execution works for both naming conventions */
    if(c.k){c.res=c.res||{legacy:false}; AD_DIM_KEYS.forEach(k=>{if(c.k[k])c.res[k]=c.k[k];});
      if(!c.dims)c.adOnly=true;}
  });
  return list;
}
/* how much of a period's mapped spend actually carries dimension `k` — a 2% dimension is not an axis */
function adDimCoverage(combos,k){
  const tot=combos.reduce((a,c)=>a+c.spend,0)||1;
  return combos.filter(c=>c.res&&c.res[k]).reduce((a,c)=>a+c.spend,0)/tot;
}
function benchCPA(scope){
  /* the benchmark is ALWAYS the whole account for the period — never the average of the rows on screen.
     A concept is only a winner if it beats what the account as a whole is paying right now. */
  const sc=scope||perfScope();
  return sc.acctPu?sc.acctSp/sc.acctPu:0;
}

function plsNorm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').replace(/\s*\/\s*/g,'/').trim()}

/* ══════════ PLS engine runs — segundo camino de ingesta ══════════
   El modelo de arriba (D+C) asume el export de Looker y la Strategy Sheet como tabla de join.
   Una corrida de Motion no tiene D+C: llega ya taggeada por ad y agregada en combos, con
   effect y confianza calculados por el bridge (bridge/motion_to_tagged.py →
   audience_splitter.py). Por eso aterriza en B.pls y acá SOLO SE LEE: la shell muestra
   evidencia que no calculó. El motor vive en el bridge hasta el paso 2 del merge.

   Diferencia que importa contra el heat map de CPA de arriba: el CPA promedio de un combo
   se lo lleva el creativo donde Meta puso la plata. El `effect` trata a cada creativo como
   evidencia y NO pondera por spend — por eso los dos mapas pueden contradecirse, y ahí
   está el valor. */
const plsRun=()=>(B&&B.pls&&B.pls.tested&&B.pls.tested.length)?B.pls:null;
const plsFmt$=n=>'$'+Math.round(n||0).toLocaleString();
function plsEvidence(kind,name){
  /* toda la evidencia que el motor tiene sobre UNA dimensión del Layer (un CTP o un angle) */
  const R=plsRun(); if(!R||!name)return null;
  if(R.run_type==='execution_analysis')return null; /* M6 describe ejecuciones, no valida CTPs ni ángulos */
  const key=plsNorm(name);
  /* segment es multivaluado en una corrida ("Amazon Prime members / Families"): un combo
     cuenta como evidencia del segmento si lo contiene, no solo si es idéntico */
  const hits=kind==='segment'
    ? R.tested.filter(t=>plsNorm(t.segment).split('/').map(s=>s.trim()).includes(key))
    : R.tested.filter(t=>plsNorm(t[kind])===key);
  if(!hits.length)return null;
  const spend=hits.reduce((a,t)=>a+(t.spend||0),0);
  const conv=hits.reduce((a,t)=>a+(t.conv||0),0);
  /* effect y conf son por combo: se promedian ponderando por la confianza de cada uno,
     que es exactamente "cuánta prueba real hay detrás". Un combo con conf 0 no vota. */
  const w=hits.reduce((a,t)=>a+(t.conf||0),0);
  return {n:hits.length, spend, conv, cpa:conv?spend/conv:null,
    effect:w?hits.reduce((a,t)=>a+(t.effect||0)*(t.conf||0),0)/w:null,
    /* la confianza NO se suma entre combos: dos combos flojos no hacen uno fuerte.
       Se toma la del combo mejor probado — es "cuánta prueba hay en el mejor caso". */
    conf:Math.max(...hits.map(t=>t.conf||0)),
    combos:hits};
}
function plsEvBadge(kind,name){
  /* la píldora que se muestra al lado del selector de Validation en el Strategy Layer */
  const e=plsEvidence(kind,name); if(!e)return '';
  const col=e.effect==null?'var(--ink3)':e.effect>=6?'var(--good)':e.effect<=-6?'var(--bad)':'var(--ink2)';
  const sign=e.effect==null?'sin señal':(e.effect>0?'+':'')+e.effect.toFixed(0);
  return `<span title="El motor PLS vio ${e.n} combinación(es) con esta dimensión · ${plsFmt$(e.spend)} de spend · CPA ${e.cpa?plsFmt$(e.cpa):'—'} · efecto ${sign} · soporte ${e.conf}%&#10;&#10;Efecto = qué tan bien rinde contra el promedio de la cuenta (0 = igual). Confianza = cuánta prueba real hay detrás; sale solo de evidencia, nunca del prior."
    style="display:inline-block; margin-left:6px; font-size:10.5px; font-weight:700; color:${col}; white-space:nowrap">
    ⟐ ${sign} · ${e.conf}%</span>`;
}
function plsStatusColor(s){
  return {'Winner':'var(--good)','Promising':'var(--good)','Weak':'var(--bad)',
          'Contradictory':'var(--warn)','Insufficient evidence':'var(--ink3)'}[s]||'var(--ink2)';
}

/* ══ monthly trend — the shape of the account over time; click a month to scope everything to it ══ */
function monthTrend(sc){
  const ms=monthsOf(); if(!ms.length)return '';
  const hasConv=ms.some(m=>m.pu);
  /* a dataset with no conversions (e.g. SESA in Motion) charts SPEND — a page of $0 CPAs is worse than honesty */
  const pts=ms.map(m=>({...m,cpa:hasConv?(m.pu?m.sp/m.pu:0):m.sp}));
  const hi=Math.max(...pts.map(p=>p.cpa))||1;
  /* axis starts at 70% of the worst month — a 0-based axis makes a $404 vs $492 swing look identical */
  const base=hi*0.7, span=hi-base;
  /* colour against the WHOLE range, never against the selected period — otherwise picking July
     repaints every other month "vs July" and a month's colour stops meaning anything on its own */
  const bench=benchCPA(scopeFor('all'));
  return `<div class="trend">
    ${pts.map(p=>{
      const on=PER.sel===p.m||PER.sel==='all';
      const sel=PER.sel===p.m;
      const h=Math.max(8,Math.round(((p.cpa-base)/span)*100));
      const good=hasConv?p.cpa<=bench:true;
      return `<div class="tcol ${sel?'sel':''}" onclick="setPeriod('${p.m}')" title="${esc(p.lbl)} · $${Math.round(p.sp).toLocaleString()} spend · ${p.pu.toLocaleString()} purchases · CPA $${Math.round(p.cpa)}${p.partial?' · PARTIAL MONTH':''}">
        <div class="tv">${hasConv?'$'+Math.round(p.cpa):'$'+Math.round(p.cpa/1000)+'k'}</div>
        <div class="tbar" style="height:${h}%; background:${good?'var(--hm2)':'var(--hmw2)'}; opacity:${on?1:.35}"></div>
        <div class="tl">${esc(p.lbl.replace(' 2026','').replace(' (1–6)','*'))}</div></div>`;}).join('')}
    </div>
    <div class="hint" style="margin-top:6px">bar = ${hasConv?'account CPA that month (lower is better)':'account SPEND that month — this dataset has no conversions, see the source note above'} · green = at or below the full-range benchmark of $${Math.round(bench)} · click a month to scope the whole page to it${pts.some(p=>p.partial)?' · * partial month':''} · <i>axis starts at $${Math.round(base)}, not $0, so the swing is readable</i></div>`;
}

    ${retagged.length?`<div style="margin-top:10px"><b style="font-size:12.5px">Confirmed re-tags</b>${retagged.map(k=>{const r=B.perfRetag[k];

  return `

/* ══ casting radar — performance grouped by Talent WITHIN each segment.
   Exploratory signal only, never validation (the sample is not controlled): its one output is
   "this casting deserves to be promoted to a segment and tested in a pair". Feeds on the D+C join
   to Strategy Sheet rows whose Talent column is filled (controlled vocabulary since the dropdowns). ══ */
function castingRadar(sc){
  const hasSheet=B.sheet&&B.sheet.rows.length;
  /* sheet D+C → {talent, segment} */
  const meta={};
  if(hasSheet)B.sheet.rows.forEach(r=>{
    const d=parseInt(String(r.d||'').replace(/\D/g,''),10), c=parseInt(String(r.c||'').replace(/\D/g,''),10);
    if(d&&c&&r.talent)meta[d+'-'+c]={talent:r.talent,segment:r.segment||'—'};});
  const bench=benchCPA(sc), groups={};
  if(Object.keys(meta).length)perfCombos(sc).forEach(cb=>{
    if(cb.d==null||cb.c==null)return; const m=meta[cb.d+'-'+cb.c]; if(!m)return;
    const g=groups[m.segment]=groups[m.segment]||{};
    const t=g[m.talent]=g[m.talent]||{sp:0,pu:0,n:0};
    t.sp+=cb.spend; t.pu+=cb.purch||0; t.n++;});
  const segs=Object.entries(groups);
  /* what's registered but has no performance yet — shows the pipeline is working */
  const waiting={};
  Object.values(meta).forEach(m=>{const k=m.segment+' › '+m.talent; waiting[k]=true;});
  segs.forEach(([s,g])=>Object.keys(g).forEach(t=>delete waiting[s+' › '+t]));
  const body=segs.length?segs.map(([segName,g])=>{
    const rows=Object.entries(g).map(([t,v])=>({t,...v,cpa:v.pu?v.sp/v.pu:null})).sort((a,b)=>b.sp-a.sp);
    const meaningful=rows.filter(r=>r.cpa&&r.sp>=2000);
    /* candidate: within the same segment, one casting's CPA is ≥25% better than another meaningful one */
    const best=meaningful.length>1?meaningful.reduce((a,b)=>a.cpa<b.cpa?a:b):null;
    const worst=meaningful.length>1?meaningful.reduce((a,b)=>a.cpa>b.cpa?a:b):null;
    const candidate=best&&worst&&best.t!==worst.t&&best.cpa<=worst.cpa*0.75?best.t:null;
    return `<div style="margin-bottom:10px"><b style="font-size:12.5px">${esc(segName)}</b>
      ${rows.map(r=>{const pct=r.cpa?Math.round((1-r.cpa/bench)*100):null;
        return `<div class="fbrow">🎭 <b>${esc(r.t)}</b> — ${r.n} concept(s) · $${Math.round(r.sp).toLocaleString()} · CPA ${r.cpa?'$'+Math.round(r.cpa):'—'}${pct!==null?` (${pct>0?'+':''}${pct}% vs bench)`:''}
        ${candidate===r.t?` <span style="color:var(--accent); font-weight:700">🔺 reacts differently than its segment-mates — candidate to PROMOTE (↑ in the Strategy Layer) and test in a pair</span>`:''}</div>`;}).join('')}</div>`;}).join('')
   :`<div class="hint">No casting-tagged performance in this period yet. The radar fills itself as tests run: pick a <b>Suggested casting</b> in the roadmap (or set the <b>Talent</b> dropdown per row in the Strategy Sheet) → the ad ships → performance comes back by D#+C# → it lands here, grouped by casting inside its segment.</div>`;
  return `<div class="card"><div class="card-h"><h3>📡 Casting radar · ${esc(sc.label)}</h3>
    <span class="hint">exploratory signal, NEVER validation — the sample isn’t controlled. Its only output: “this casting deserves promotion to segment + a paired test.”</span></div>
    <div class="card-b">${body}
    ${Object.keys(waiting).length?`<div class="hint" style="margin-top:8px">⏳ Registered, waiting for performance: ${Object.keys(waiting).map(esc).join(' · ')}</div>`:''}</div></div>`;
}
/* ══════════ BACKFILL WORKLIST ══════════
   The matrix stays empty while the biggest-spending ads have no dimensions. This is that debt, sorted
   so the most expensive unknown is on top: what it cost, what it's missing, a link to actually look at
   the ad, and dropdowns for only the gaps. A human decision here beats every automatic guess, so a
   confirmed row wins over the ad name and over the Strategy Sheet (see perfCombos).
   Tags live in B.perfTags and are exportable — a tag stuck in one browser's localStorage is not a tag. */
let BF={sort:'spend',show:12};
function backfillRows(sc){
  const rows=perfCombos(sc).map(c=>{
    const r=c.res||{}; const missing=[];
    if(!r.ctp||r.ctp==='unresolved legacy')missing.push('ctp');
    if(!r.segment||r.segment==='unassigned')missing.push('segment');
    if(!r.angle)missing.push('angle');
    return {...c,missing,cpa:c.purch?c.spend/c.purch:null,
      tagged:!!(B.perfTags||{})[c.key], legacy:!!r.legacy};
  }).filter(c=>c.missing.length&&!c.tagged&&!c.legacy); /* legacy rows have their own card — don't double-ask */
  return BF.sort==='cpa'
    ? rows.filter(r=>r.cpa).sort((a,b)=>a.cpa-b.cpa).concat(rows.filter(r=>!r.cpa))
    : rows.sort((a,b)=>b.spend-a.spend);
}
function adLink(c){
  /* the real ad in Ads Manager when we pulled its id; otherwise Motion filtered by name */
  if(c.ai&&PERF_MONTHS.acct)return `https://adsmanager.facebook.com/adsmanager/manage/ads?act=${PERF_MONTHS.acct}&selected_ad_ids=${c.ai}`;
  return 'https://app.motionapp.com/search?q='+encodeURIComponent(String(c.label).split('|')[0].trim());
}
function bfSort(v){BF.sort=v; render();}
function bfMore(){BF.show+=12; render();}
function tagRow(key){
  const g=id=>{const e=document.getElementById(id); return e?e.value:'';};
  const t={ctp:g('bf-c-'+key),segment:g('bf-s-'+key),angle:g('bf-a-'+key)};
  if(!t.ctp&&!t.segment&&!t.angle){alert('Pick at least one dimension before confirming.');return;}
  B.perfTags=B.perfTags||{};
  B.perfTags[key]={...t, at:new Date().toISOString().slice(0,10), by:(route.strategist||'—')};
  save(); render();
}
function untagRow(key){delete (B.perfTags||{})[key]; save(); render();}
function exportTags(){
  const t=B.perfTags||{}, ks=Object.keys(t);
  if(!ks.length){alert('No confirmed tags yet.');return;}
  const head=['Ad / concept','D','C','CTP','Segment','Angle','Tagged by','Date'].join('\t');
  const all=perfCombos(scopeFor('all'));
  const body=ks.map(k=>{const c=all.find(x=>x.key===k)||{}; const v=t[k];
    return [String(c.label||k).replace(/\t/g,' '), c.d??'', c.c??'', v.ctp||'', v.segment||'', v.angle||'', v.by||'', v.at||''].join('\t');});
  const tsv=[head,...body].join('\n');
  navigator.clipboard.writeText(tsv).then(
    ()=>alert(ks.length+' tagged row(s) copied as TSV.\n\nPaste straight into the Strategy Sheet — a tag that only lives in this browser is not a tag.'),
    ()=>{const w=window.open('','_blank'); w.document.write('<pre>'+esc(tsv)+'</pre>');});
}
/* ── TAG PACK — the PoC's human tagging is a deliverable in itself.
   Everything a strategist confirms here (backfill tags + legacy re-tags) downloads as one
   JSON pack, so it can seed the production version of the product — and can be imported
   into another browser/strategist meanwhile. Local tags win on conflict. */
function downloadTagPack(){
  const nT=Object.keys(B.perfTags||{}).length, nR=Object.keys(B.perfRetag||{}).length;
  if(!nT&&!nR){alert('No human tags yet — confirm a backfill row or a legacy re-tag first.');return;}
  const pack={product:'RS Strategy OS (PoC)',schema:'tag-pack-v1',brand:B.code,brandName:B.name,
    exportedAt:new Date().toISOString(),by:route.strategist||'—',
    counts:{backfillTags:nT,legacyRetags:nR},
    perfTags:B.perfTags||{},perfRetag:B.perfRetag||{}};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(pack,null,1)],{type:'application/json'}));
  a.download=`tagpack-${B.code}-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
async function importTagPack(inp){
  const f=inp.files[0]; if(!f)return; const txt=await f.text(); inp.value='';
  try{
    const p=JSON.parse(txt);
    if(p.schema!=='tag-pack-v1')throw new Error('not a tag pack (schema mismatch)');
    if(p.brand!==B.code&&!confirm(`This pack was exported for ${p.brandName||p.brand} and you are on ${B.name}.\n\nImport anyway?`))return;
    B.perfTags=B.perfTags||{}; B.perfRetag=B.perfRetag||{};
    let add=0,skip=0;
    Object.entries(p.perfTags||{}).forEach(([k,v])=>{if(B.perfTags[k])skip++;else{B.perfTags[k]=v;add++;}});
    Object.entries(p.perfRetag||{}).forEach(([k,v])=>{if(B.perfRetag[k])skip++;else{B.perfRetag[k]=v;add++;}});
    save(); render();

async function loadPerf(inp){

      for(const line of lines.slice(1)){

/* One line = one delivery. A new lane proposes the next free delivery number. */
function nextDelivery(){const ds=((B.draft||{}).lanes||[]).map(l=>+l.delivery||0);
  return Math.max(rmDefaultDelivery(),...ds,0)+1;}

/* ── dates ── */
const parseYMD=v=>{const [a,b,c]=String(v||'').split('-').map(Number); return (a&&b&&c)?new Date(a,b-1,c):null;};
const ymdOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d); x.setDate(x.getDate()+n); return x;};
const fmtD=d=>d?d.toLocaleString('en-US',{month:'short',day:'numeric'}):'—';
const bdToCal=bd=>Math.ceil(bd*7/5);
const weekday=d=>{const x=new Date(d); const w=x.getDay(); if(w===6)x.setDate(x.getDate()-1); if(w===0)x.setDate(x.getDate()-2); return x;};
const perWeeks=()=>Math.max(1,+RM().period.weeks||1);
const perStart=()=>parseYMD(RM().period.start);
const perDays=()=>perWeeks()*7;
const perEnd=()=>{const st=perStart(); return st?addDays(st,perDays()-1):null;};
function periodLabel(){
  const st=perStart(); if(!st)return '';
  const en=perEnd();
  const sameYear=st.getFullYear()===en.getFullYear();
  return `${fmtD(st)}${sameYear?'':', '+st.getFullYear()} – ${fmtD(en)}, ${en.getFullYear()} · ${perWeeks()} week${perWeeks()>1?'s':''}`;
}
/* the contract is monthly; null = no data yet (HubSpot wiring pending) */
const perMonth=()=>RM().contract.perMonth;
const rmCapacity=()=>perMonth()==null?null:Math.round(perMonth()*perWeeks()/(52/12));
const plannedConcepts=lanes=>(lanes||[]).reduce((a,l)=>a+(+l.concepts||0),0);
function rmSetPer(k,v){RM().period[k]=(k==='weeks'?Math.max(1,Math.min(52,+v||1)):v); RM().deliveryDates={}; save(); render();}
function rmSetContract(v){const n=+v; RM().contract.perMonth=(v===''||isNaN(n))?null:Math.max(0,n); save(); render();}
function setTh(k,v){
  const r=RM(); r.thesis[k]=v;
  if(B.roadmap){B.roadmap.thesis=B.roadmap.thesis||{}; B.roadmap.thesis[k]=v;
    if(k==='title')B.roadmap.title=(v?v+' — ':'')+B.roadmap.period+' — '+B.name+' Creative Roadmap';}
  save();
}
function rmSetDue(d,v){if(v)RM().deliveryDates[d]=v; else delete RM().deliveryDates[d]; save(); render();}
function rmDueDate(d,idx,n){
  if(RM().deliveryDates[d])return parseYMD(RM().deliveryDates[d]);
  const st=perStart(); if(!st)return null;
  return weekday(addDays(st,Math.round((idx+1)*perDays()/n)-1));
}
function rmDeliveries(lanes){
  const g={};
  (lanes||[]).forEach((l,i)=>{const d=+l.delivery||0; if(!d)return; (g[d]=g[d]||[]).push({...l,_i:i});});
  return Object.keys(g).map(Number).sort((a,b)=>a-b).map(d=>({d,lanes:g[d]}));
}
/* the resolved production plan per delivery — due dates default to an even weekday spread
   across the period (the production-calendar module makes them editable; step 7) */
function rmPlan(lanes){
  const ds=rmDeliveries(lanes), n=ds.length||1;
  return ds.map((g,i)=>{
    const specs=g.lanes.flatMap(l=>(l.conceptSpecs||[]).slice(0,Math.max(1,+l.concepts||1)));
    const routes=specs.map(x=>menuOf(x.route)).filter(Boolean);
    const unset=specs.length-routes.length;
    const bd=routes.length?Math.max(...routes.map(m=>m.bd||0)):0;
    const cost=routes.reduce((a,m)=>a+(m.cost||0),0);
    const due=rmDueDate(g.d,i,n);
    const start=due&&bd?addDays(due,-(bdToCal(bd)-1)):null;
    return {...g,concepts:specs.length,routes,unset,bd,cost,due,start,
      late:start&&perStart()?start<perStart():false};
  });
}
function dueMapOf(lanes){const m={}; rmPlan(lanes).forEach(x=>{m[x.d]=x;}); return m;}

/* ═══════════ THE COMPOSER — multi-select → cartesian batch (lab it3) ═══════════
   Every dimension holds an ARRAY: two personas × three angles composes six swimlanes
   in one pass. Casting/format/route are decided PER CONCEPT (comp.specs); the lane
   keeps castings[]/formats[] as the de-duplicated union so the sheet's rule
   ("one → pre-fill, several → assign per row") keeps working unchanged. */
function rmBlank(){return {open:null,f:'',ctp:[],segment:[],angle:[],funnel:[],phase:[],hypothesis:'',concepts:1,variants:'',notes:'',specs:[{casting:'',format:'',route:''}],delivery:''};}
const STEPS=['ctp','segment','angle','funnel','phase'];
const STEP_LBL={ctp:'CTP',segment:'Segment',angle:'Angle',funnel:'Funnel',phase:'Phase'};
const OPTS={ctp:()=>B.layer.ctps.map(c=>c.name),segment:()=>B.layer.segments.map(s=>s.name),angle:()=>B.layer.angles.map(a=>a.name),funnel:()=>FUNNELS,phase:()=>PHASES};
/* a section is open while it has no selection, or while explicitly opened to add a 2nd value —
   the plain path stays five clicks, a broad round is one extra click per extra value */
const isOpen=k=>comp.open===k||(!comp.open&&k===STEPS.find(x=>!(comp[x]||[]).length));
function pickTk(k,v){
  const a=comp[k]=comp[k]||[]; const i=a.indexOf(v);
  if(i>=0)a.splice(i,1); else a.push(v);
  if(k==='segment')(comp.specs||[]).forEach(sp=>{
    if(sp.casting&&!comp.segment.some(sg=>((B.layer.segments.find(x=>x.name===sg)||{}).casting||[]).includes(sp.casting)))sp.casting='';});
  comp.f=''; render();
}
function openSec(k){comp.open=comp.open===k?null:k;comp.f='';render();}
function setF(v){comp.f=v; const el=document.getElementById('chipbox-angle'); if(el)el.innerHTML=chipsHtml('angle');}
function setConcepts(n){
  n=Math.max(1,+n||1); comp.concepts=n;
  const sp=comp.specs||[];
  while(sp.length<n)sp.push({casting:'',format:'',route:''});
  comp.specs=sp.slice(0,n); render();
}
function setSpec(i,k,v){const sp=(comp.specs[i]=comp.specs[i]||{casting:'',format:'',route:''});
  sp[k]=v;
  if(k==='format'&&!sp.route&&ROUTE_DEFAULT[v])sp.route=ROUTE_DEFAULT[v];
  render();}
function specAll(k){const v=(comp.specs[0]||{})[k]||''; comp.specs.forEach(x=>x[k]=v); render();}
/* the composer's casting menu: the union of the selected segments' talent menus */
function castMenu(){const out=[];
  (comp.segment||[]).forEach(n=>{const sg=B.layer.segments.find(x=>x.name===n); if(sg)out.push([sg.name,sg.casting||[]]);});
  return out;}
function chipsHtml(cur){
  const f=cur==='angle'?(comp.f||'').toLowerCase():'';
  const list=OPTS[cur]().filter(Boolean).filter(v=>!f||v.toLowerCase().includes(f));
  if(!list.length)return '<div class="hint">Nothing matches — clear the filter.</div>';
  return list.map(v=>{
    let tip='';
    if(cur==='segment'){const sg=B.layer.segments.find(x=>x.name===v); if(sg)tip=`${sg.age}${(sg.casting||[]).length?' — '+sg.casting.join(' · '):''}`;}
    if(cur==='ctp'){const pr=B.layer.ctps.find(x=>x.name===v); if(pr&&pr.insight)tip=pr.insight;}
    return `<span class="chip ${(comp[cur]||[]).includes(v)?'sel':''}" ${tip?`title="${esc(tip)}"`:''} onclick="pickTk('${cur}','${esc(v).replace(/'/g,"\\'")}')">${esc(v)}</span>`;
  }).join('');
}
function chipKey(ev){
  if(ev.key==='Enter'){const first=document.querySelector('#chipbox-angle .chip'); if(first)first.click();}
  else if(ev.key==='Escape')setF('');
}
/* the cartesian product of everything selected — the swimlanes this composer will emit */
function combos(){
  if(!STEPS.every(k=>(comp[k]||[]).length))return [];
  const out=[];
  comp.ctp.forEach(c=>comp.segment.forEach(s=>comp.angle.forEach(a=>comp.funnel.forEach(f=>comp.phase.forEach(ph=>{
    out.push({ctp:c,segment:s,angle:a,funnel:f,phase:ph});})))));
  return out;
}
function addLane(){
  const cs=combos();
  if(!cs.length){alert('Pick at least one value in each of the five steps.');return;}
  if(!comp.hypothesis.trim()){alert('Write a brief hypothesis — it is what makes this a test.');return;}
  if(comp._edit!==undefined&&cs.length>1){if(!confirm('You are editing one swimlane but selected '+cs.length+' combinations.\n\nThe first replaces it; the other '+(cs.length-1)+' are added after it. Continue?'))return;}
  if(cs.length>12&&!confirm('This composes '+cs.length+' swimlanes ('+cs.length*(+comp.concepts||1)+' concepts). Continue?'))return;
  const dlv=+comp.delivery||nextDelivery();
  const made=cs.map(c=>{
    const menu=((B.layer.segments.find(x=>x.name===c.segment)||{}).casting)||[];
    /* a casting from another segment's menu cannot travel to this lane — dropped, not mis-assigned */
    const specs=(comp.specs||[]).slice(0,+comp.concepts||1)
      .map(x=>({casting:menu.includes(x.casting)?x.casting:'',format:x.format||'',route:x.route||''}));
    return {...c,hypothesis:comp.hypothesis,concepts:+comp.concepts||1,variants:comp.variants?+comp.variants:'',
      notes:comp.notes,conceptSpecs:specs,
      castings:[...new Set(specs.map(x=>x.casting).filter(Boolean))],
      formats:[...new Set(specs.map(x=>x.format).filter(Boolean))],delivery:dlv};});
  if(comp._edit!==undefined){B.draft.lanes.splice(comp._edit,1,...made);}
  else made.forEach(l=>B.draft.lanes.push(l));
  comp=rmBlank(); save(); render();
}
function editLane(i){const l=B.draft.lanes[i];
  const n=Math.max(1,+l.concepts||1);
  const specs=(l.conceptSpecs||[]).map(x=>({...x}));
  while(specs.length<n)specs.push({casting:(l.castings||[])[0]||'',format:(l.formats||[])[0]||'',route:''});
  comp={...rmBlank(),ctp:[l.ctp],segment:[l.segment],angle:[l.angle],funnel:[l.funnel],phase:[l.phase],
    hypothesis:l.hypothesis,concepts:n,variants:l.variants,notes:l.notes,delivery:l.delivery||'',
    specs:specs.slice(0,n),_edit:i};
  render();}
/* same test, later delivery = a SECOND line — the copy is independent evidence */
function dupLane(i){const l=B.draft.lanes[i];
  B.draft.lanes.splice(i+1,0,{...l,castings:(l.castings||[]).slice(),formats:(l.formats||[]).slice(),conceptSpecs:(l.conceptSpecs||[]).map(x=>({...x})),delivery:nextDelivery()});
  save();render();}
function setDelivery(i,v){B.draft.lanes[i].delivery=+v||'';save();render();}
/* concept numbers run in ONE ascending sequence across the roadmap, ordered by delivery */
function laneOrder(lanes){return lanes.map((l,i)=>({l,i})).sort((a,b)=>(+a.l.delivery||9999)-(+b.l.delivery||9999)||a.i-b.i);}
function conceptNumbers(lanes){
  if(lanes.length&&lanes.every(l=>(l.conceptNums||[]).length))return Object.fromEntries(lanes.map((l,i)=>[i,l.conceptNums]));
  const out={}; let c=+RM().conceptStart||1;
  laneOrder(lanes).forEach(({l,i})=>{const n=Math.max(1,+l.concepts||1);out[i]=[];for(let k=0;k<n;k++)out[i].push(c++);});
  return out;
}

/* ═══════════ THE LINE MAP (lab it2) — the roadmap as a transit network.
   One swimlane = one LINE; stations CTP → Segment → Angle; a value shared by two
   lanes is ONE hollow station (an interchange: they inherit each other's evidence).
   After the Angle the line fans out into its concepts; the DELIVERY is the terminus
   (one line = one delivery — running a test again means duplicating the line).
   Station stats show the Strategy Layer's validation for now; the evidence numbers
   (confidence/effect) land with the knowledge engine in step 5. */
const TX={head:34,ctp:212,seg:452,ang:688,con:900,end:1180};
const CONC_GAP=26, MIN_GAP=56, TUBE_TOP=40;
const trunc=(t,n)=>String(t).length>n?String(t).slice(0,n-1)+'…':String(t);
function layerValOf(k,v){
  if(k==='ctp')return (B.layer.ctps.find(x=>x.name===v)||{}).val||'';
  if(k==='segment')return (B.layer.segments.find(x=>x.name===v)||{}).val||'';
  if(k==='angle')return (B.layer.angles.find(x=>x.name===v)||{}).val||'';
  return '';
}
function tubeModel(lanes){
  const nums=conceptNumbers(lanes);
  let y=TUBE_TOP;
  const L=laneOrder(lanes).map(({l,i},pos)=>{
    const n=Math.max(1,+l.concepts||1), h=Math.max(50,n*CONC_GAP+18);
    const o={...l,i,pos,color:TUBE_C(i),n,nums:nums[i],y:y+h/2,h}; y+=h; return o;});
  const H=y+TUBE_TOP-6;
  const nodes={}, cols=[['ctp',TX.ctp],['segment',TX.seg],['angle',TX.ang]];
  cols.forEach(([k,x])=>{
    const g={}; L.forEach(l=>{const v=l[k]||'-';(g[v]=g[v]||[]).push(l);});
    const arr=Object.entries(g).map(([v,ls])=>({k,v,ls,x,y:ls.reduce((a,b)=>a+b.y,0)/ls.length}));
    arr.sort((a,b)=>a.y-b.y);
    for(let i=1;i<arr.length;i++)if(arr[i].y-arr[i-1].y<MIN_GAP)arr[i].y=arr[i-1].y+MIN_GAP;
    arr.forEach(n=>nodes[k+''+n.v]=n);
  });
  return {L,H:Math.max(H,TUBE_TOP*2+40),nodes,nodeOf:(k,v)=>nodes[k+''+(v||'-')]};
}
function elbow(x1,y1,x2,y2){
  const dy=y2-y1;
  if(Math.abs(dy)<0.6)return `M${x1},${y1.toFixed(1)} L${x2},${y2.toFixed(1)}`;
  const a=Math.abs(dy), m=Math.max(x1+12,x2-16-a);
  return `M${x1},${y1.toFixed(1)} L${m.toFixed(1)},${y1.toFixed(1)} L${(m+a).toFixed(1)},${y2.toFixed(1)} L${x2},${y2.toFixed(1)}`;
}
function vTube(lanes,opts){
  opts=opts||{};
  const SVGID=opts.id||'tubesvg';
  if(!lanes.length)return `<div class="card"><div class="card-h"><h3>\u{1F687} The line map</h3>
    <span class="hint">every swimlane is a line — shared dimensions become interchanges</span></div>
    <div class="card-b"><div class="hint">Nothing running yet. Add the first swimlane and its line appears here, with its delivery as terminus.</div></div></div>`;
  const M=tubeModel(lanes);
  const edges=[];
  M.L.forEach(l=>{
    const a=M.nodeOf('ctp',l.ctp), b=M.nodeOf('segment',l.segment), c=M.nodeOf('angle',l.angle);
    edges.push({l,k:'head'+l.i,x1:TX.head+30,y1:l.y,n2:a});
    edges.push({l,k:a.v+'||'+b.v+'|2',n1:a,n2:b});
    edges.push({l,k:b.v+'||'+c.v+'|3',n1:b,n2:c});
  });
  const grp={}; edges.forEach(e=>{(grp[e.k]=grp[e.k]||[]).push(e);});
  const paths=[];
  Object.values(grp).forEach(g=>g.forEach((e,j)=>{
    const off=(j-(g.length-1)/2)*4.6;

    paths.push(`<path class="ln l${e.l.i}" stroke="${e.l.color}" d="${elbow(x1,y1,x2,y2)}"><title>${esc(e.l.ctp)} · ${esc(e.l.segment)} · ${esc(e.l.angle)} — D${String(e.l.delivery||0).padStart(3,'0')}</title></path>`);
  }));

    for(let k=0;k<l.n;k++)paths.push(`<path class="ln l${l.i}" stroke="${l.color}" stroke-width="4.2" d="${elbow(c.x,c.y,TX.con,y0+k*CONC_GAP)}"></path>`);
  });
  const st=[];

    const seen=new Set();

      const multi=n.ls.length>1, val=layerValOf(k,n.v);

        +(multi?'\n\nINTERCHANGE: '+n.ls.length+' lines pass through here ('+n.ls.map(x=>'D'+(x.delivery||'?')).join(', ')+'). They share whatever this dimension teaches, so neither can be read alone.':'');
      st.push(`<g class="st ${cls}"><title>${tip}</title>
        ${multi?`<circle class="ic" cx="${n.x}" cy="${n.y.toFixed(1)}" r="9"></circle>`
               :`<circle class="sn" cx="${n.x}" cy="${n.y.toFixed(1)}" r="6.5" fill="${n.ls[0].color}"></circle>`}
        <text x="${n.x}" y="${(n.y-15).toFixed(1)}" text-anchor="middle">${esc(trunc(n.v,30))}</text>
        <text class="sub" x="${n.x}" y="${(n.y+22).toFixed(1)}" text-anchor="middle">${esc(val||'')}${multi?(val?' · ':'')+'⇄ '+n.ls.length+' lines':''}</text></g>`);
    });
  });
  M.L.forEach(l=>{
    const d=l.delivery?'D'+String(l.delivery).padStart(3,'0'):'D—';
    st.push(`<g class="st l${l.i}"><title>Swimlane ${l.i+1} — ${esc(l.ctp)} · ${esc(l.segment)} · ${esc(l.angle)} · ${esc(l.funnel)}/${esc(l.phase)}
${esc(l.hypothesis||'')}</title>
      <rect x="${TX.head-4}" y="${(l.y-13).toFixed(1)}" width="66" height="26" rx="8" fill="${l.color}"></rect>
      <text class="dl" x="${TX.head+29}" y="${(l.y+3.5).toFixed(1)}" text-anchor="middle">${d}</text>
      <text class="sub" x="${TX.head+29}" y="${(l.y+24).toFixed(1)}" text-anchor="middle">${esc(l.funnel)} · ${esc(l.phase)}</text></g>`);
    const y0=l.y-(l.n-1)*CONC_GAP/2;
    for(let k=0;k<l.n;k++){
      const y=y0+k*CONC_GAP, cn='C'+String(l.nums[k]).padStart(3,'0');
      const sp=(l.conceptSpecs||[])[k];
      const cast=(l.castings||[]), fmt=(l.formats||[]);
      const tail=sp?[sp.format||'', sp.casting?trunc(sp.casting,22):''].filter(Boolean).join(' · ')
        :[fmt.length===1?fmt[0]:fmt.length?fmt.length+' fmt':'',cast.length===1?trunc(cast[0],20):cast.length?cast.length+' castings':''].filter(Boolean).join(' · ');
      const ctip=cn+(l.variants?' × '+l.variants+' variant(s)':'')
        +(sp?('\nCasting: '+esc(sp.casting||'— assigned in the sheet')+'\nFormat: '+esc(sp.format||'— assigned in the sheet')+(sp.route&&menuOf(sp.route)?'\nRoute: '+esc(menuOf(sp.route).name):''))
          :(cast.length?'\nCasting menu: '+esc(cast.join(', ')):'')+(fmt.length?'\nFormat: '+esc(fmt.join('/')):''));
      st.push(`<g class="st l${l.i}"><title>${ctip}</title>
        <circle class="sn" cx="${TX.con}" cy="${y.toFixed(1)}" r="5" fill="${l.color}"></circle>
        <text class="cn" x="${TX.con+11}" y="${(y+3.5).toFixed(1)}">${cn}${l.variants?` <tspan class="sub">×${l.variants}</tspan>`:''}</text>
        ${tail?`<text class="sub" x="${TX.con+64}" y="${(y+3.5).toFixed(1)}">${esc(trunc(tail,32))}</text>`:''}</g>`);
    }
  });
  const inter=Object.values(M.nodes).filter(n=>n.ls.length>1).length;
  const svg=`<svg class="tube" id="${SVGID}" viewBox="0 0 ${TX.end} ${M.H}" height="${M.H}" onmouseleave="hlLane(null)">
    ${paths.join('')}${st.join('')}
  </svg>`;
  if(opts.raw)return svg;
  return `<div class="card"><div class="card-h"><h3>\u{1F687} The line map</h3>
    <span class="hint">${M.L.length} line${M.L.length>1?'s':''} · ${inter} interchange${inter===1?'':'s'} · concepts from
      <input class="dnum" style="width:56px!important;border:1px solid var(--line2);background:var(--card2);color:var(--ink);border-radius:7px;padding:2px 4px;font:inherit;font-size:11.5px" value="${+RM().conceptStart||1}" title="First concept number. The rest follow in one ascending run, ordered by delivery." onchange="RM().conceptStart=+this.value||1;save();render()"></span>
    ${opts.acts||''}</div>
  <div class="card-b"><div class="tubewrap">${svg}</div>
  <div class="hint" style="margin-top:8px">Hollow station = <b>interchange</b>: two or more lines pass through the same dimension, so they inherit each other's evidence — and neither can be read alone. A filled station belongs to one line. The terminus is the <b>delivery</b>: one line = one delivery, so to run the same test again later you duplicate the line. The note under each station is the Strategy Layer's validation (evidence numbers arrive with the knowledge engine).</div></div></div>`;
}
function hlLane(i){const e=document.getElementById('tubesvg'); if(!e)return;
  e.classList.toggle('hl',i!=null);
  e.querySelectorAll('.ln,.st').forEach(n=>n.classList.toggle('on',i!=null&&n.classList.contains('l'+i)));}
/* ═══════════ THE EXPORT HUB (lab it7/it8) — one roadmap, six audiences ═══════════
   The sheet needs machine rows, production needs dates and costs, the brief maker needs
   the strategy payload, humans need prose, a review needs a printable page, and the app
   needs the contract object. Columns the roadmap does not know are left BLANK on purpose. */
let RMX={exp:null};
const cleanCell=v=>String(v??'').replace(/[\t\r\n]+/g,' ').trim();
const tsvOf=(cols,rows,keys)=>[cols.join('\t'),...rows.map(r=>keys.map(k=>cleanCell(r[k])).join('\t'))].join('\n');
const csvOf=(cols,rows,keys)=>[cols,...rows.map(r=>keys.map(k=>cleanCell(r[k])))]
  .map(c=>c.map(x=>/[",]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x).join(',')).join('\n');
function currentLanes(){return (B.roadmap||B.draft||{}).lanes||[];}
/* per-concept spine — everything downstream is a projection of this */
function rmConcepts(lanes){
  const nums=conceptNumbers(lanes), plan=dueMapOf(lanes), out=[];
  laneOrder(lanes).forEach(({l,i})=>{
    const n=Math.max(1,+l.concepts||1), g=plan[+l.delivery];
    for(let k=0;k<n;k++){
      const sp=(l.conceptSpecs||[])[k]||{}, m=menuOf(sp.route);
      out.push({lane:l,laneIndex:i,k,
        d:+l.delivery||0,cNum:(nums[i]||[])[k]||0,
        casting:sp.casting||((l.castings||[]).length===1?l.castings[0]:''),
        format:sp.format||((l.formats||[]).length===1?l.formats[0]:''),
        route:sp.route||'',menu:m,
        due:g&&g.due?g.due:null,
        start:(g&&g.due&&m&&m.bd)?addDays(g.due,-(bdToCal(m.bd)-1)):null});
    }
  });
  return out;
}
/* 1. Strategy Sheet rows — the tool's 31 columns, one row per variant */
function rmSheetRows(lanes){
  const rows=[];
  rmConcepts(lanes).forEach(c=>{
    const nV=+c.lane.variants||1;
    for(let v=1;v<=nV;v++)rows.push({brand:B.name.toUpperCase(),status:'Not Started',
      d:'D'+String(c.d).padStart(3,'0'),c:'C'+String(c.cNum).padStart(3,'0'),
      deliveryDue:c.due?ymdOf(c.due):'',strategist:route.strategist||'Evan',
      variant:c.lane.variants?'V'+String(v).padStart(2,'0'):'',newIter:'NEW',
      format:c.format,talent:c.casting,hypothesis:cleanCell(c.lane.hypothesis),
      product:B.layer.product.name,
      ctp:(personaOf(c.lane.ctp)||{}).tag||c.lane.ctp,segment:c.lane.segment,angle:c.lane.angle,
      funnel:c.lane.funnel,phase:c.lane.phase});
  });
  return rows;
}
/* the in-app Strategy Sheet (feeds the Brief Maker) is generated from the same rows */
function buildSheet(){
  const lanes=currentLanes();
  const rows=rmSheetRows(lanes);
  if(!rows.length){alert('No swimlanes to export.');return;}
  if(B.sheet&&B.sheet.rows.length&&!confirm('This replaces the current in-app Strategy Sheet ('+B.sheet.rows.length+' rows). Continue?'))return;
  B.sheet={rows,exportedAt:new Date().toISOString().slice(0,10),from:(B.roadmap||{}).title||((RM().thesis.title?RM().thesis.title+' — ':'')+(periodLabel()||'draft roadmap'))};
  save(); RMX.exp=null; go('sheet');
}
/* 2. Production plan (PM / Monday) */
const PROD_COLS=['Delivery','Due date','Concept','Route','Route name','Team','Business days','Menu base cost','Start by','Format','Talent','CTP','Segment','Angle'];
const PROD_KEYS=['d','due','c','route','routeName','team','bd','cost','start','format','talent','ctp','segment','angle'];
function prodRows(lanes){
  return rmConcepts(lanes).map(c=>({
    d:'D'+String(c.d).padStart(3,'0'),due:c.due?ymdOf(c.due):'',
    c:'C'+String(c.cNum).padStart(3,'0'),
    route:c.route||'',routeName:c.menu?c.menu.name:'',team:c.menu?c.menu.team:'',
    bd:c.menu&&c.menu.bd?c.menu.bd:'',cost:c.menu&&c.menu.cost?c.menu.cost:'',
    start:c.start?ymdOf(c.start):'',format:c.format,talent:c.casting,
    ctp:c.lane.ctp,segment:c.lane.segment,angle:c.lane.angle}));
}
/* 3. Brief payload — one object per concept with the strategy resolved */
function briefPayload(lanes){
  const t=RM().thesis;
  return {roadmap:{title:(B.roadmap||{}).title||t.title,period:periodLabel(),thesis:{...t}},
    concepts:rmConcepts(lanes).map(c=>{
      const pr=personaOf(c.lane.ctp)||B.layer.ctps.find(x=>x.name===c.lane.ctp)||{}, sg=segOf(c.lane.segment)||{};
      return {delivery:'D'+String(c.d).padStart(3,'0'),concept:'C'+String(c.cNum).padStart(3,'0'),
        variants:+c.lane.variants||0,dueDate:c.due?ymdOf(c.due):null,
        ctp:{name:c.lane.ctp,tag:pr.tag||null,insight:pr.insight||null,clothingPersona:pr.clothingPersona||[]},
        segment:{name:c.lane.segment,age:sg.age||null,castingMenu:sg.casting||[]},
        angle:c.lane.angle,funnel:c.lane.funnel,phase:c.lane.phase,
        hypothesis:c.lane.hypothesis,notes:c.lane.notes||'',
        casting:c.casting||null,format:c.format||null,
        production:c.menu?{route:c.menu.id,name:c.menu.name,timeline:c.menu.tl,team:c.menu.team,baseCost:c.menu.cost}:null};
    })};
}
/* 4. Human read (Slack / Notion / the client) — markdown */
function roadmapMD(lanes){
  const t=RM().thesis, plan=rmPlan(lanes), pl=plannedConcepts(lanes), cap=rmCapacity();
  const nums=conceptNumbers(lanes);
  const L=[];
  L.push('# '+((B.roadmap||{}).title||(t.title?t.title+' — ':'')+(periodLabel()||'Creative Roadmap')));
  if(t.text)L.push('',t.text);
  if(t.from||t.to)L.push('','**Coming from:** '+(t.from||'—'),'**Going to:** '+(t.to||'—'));
  L.push('','**'+(periodLabel()||'no period')+'** · '+pl+(cap!=null?' of '+cap+' contracted':'')+' concepts · '
    +lanes.length+' swimlanes'+(plan.reduce((a,x)=>a+x.bd,0)?' · '+plan.reduce((a,x)=>a+x.bd,0)+' business days of production (Menu quotes)':'')
    +(plan.reduce((a,x)=>a+x.cost,0)?' · Menu base cost $'+plan.reduce((a,x)=>a+x.cost,0).toLocaleString():''));
  plan.forEach(g=>{
    L.push('','## D'+String(g.d).padStart(3,'0')+(g.due?' — due '+fmtD(g.due)+', '+g.due.getFullYear():'')
      +(g.bd?' ('+g.bd+' business days, start by '+fmtD(g.start)+')':''));
    g.lanes.forEach(l=>{
      const cn=nums[l._i]||[];
      L.push('','**Test '+l.ctp+' in '+l.segment+', through the '+l.angle+' angle, at '+l.funnel+' as an '+l.phase+' play.**');
      L.push('> '+(l.hypothesis||'(no hypothesis)'));
      (l.conceptSpecs&&l.conceptSpecs.length?l.conceptSpecs:Array.from({length:Math.max(1,+l.concepts||1)},()=>({}))).slice(0,Math.max(1,+l.concepts||1)).forEach((sp,k)=>{
        const m=menuOf(sp.route);
        L.push('- **C'+String(cn[k]||0).padStart(3,'0')+'**'+(l.variants?' ×'+l.variants+' variants':'')
          +' — '+(sp.format||'format TBD')+(sp.casting?' · '+sp.casting:'')+(m?' · '+m.name+' ('+m.tl+')':''));
      });
      if(l.notes)L.push('','_Notes: '+l.notes+'_');
    });
  });
  L.push('','_Confidence projections ("what this roadmap will teach") arrive when the knowledge engine is wired to live performance data._');
  return L.join('\n');
}
/* 5. Contract JSON — the roadmap object exactly as the app consumes it (§6.1) */
function contractJSON(lanes){
  const r=RM(), nums=conceptNumbers(lanes), cap=rmCapacity();
  return JSON.stringify(B.roadmap||{
    title:(r.thesis.title?r.thesis.title+' — ':'')+(periodLabel()||''),period:periodLabel(),
    periodStart:r.period.start,periodWeeks:perWeeks(),periodEnd:perEnd()?ymdOf(perEnd()):null,
    thesis:{...r.thesis},conceptStart:+r.conceptStart||1,
    contract:{conceptsPerMonth:perMonth(),capacity:cap,planned:plannedConcepts(lanes),
      source:perMonth()==null?'not set (HubSpot wiring pending)':'strategist manual',of:B.name},
    schedule:rmPlan(lanes).map(x=>({delivery:x.d,due:x.due?ymdOf(x.due):null,businessDays:x.bd,menuCost:x.cost,unroutedConcepts:x.unset})),
    lanes:lanes.map((l,i)=>({...l,conceptNums:nums[i]})),consolidatedAt:null},null,1);
}

function onePagerHTML(lanes){

function consolidate(){

}

function conceptList(){
  /* one brief per concept; from sheet if exported (real D#/C#), else from roadmap lanes */
  const out=[];
  if(sheetComplete()){
    const byC={};
    B.sheet.rows.forEach(r=>{const k=r.d+r.c; (byC[k]=byC[k]||{rows:[],r}).rows.push(r);});
    Object.entries(byC).forEach(([k,v])=>{
      const r=v.r;
      const lane=B.roadmap?.lanes.find(l=>((personaOf(l.ctp)||{}).tag||l.ctp)===r.ctp&&l.angle===r.angle)||{};
      out.push({id:k,d:r.d,c:r.c,variants:v.rows.filter(x=>x.variant).length,conceptName:r.conceptName||'',
        ctp:r.ctp,segment:r.segment,angle:r.angle,funnel:r.funnel,phase:r.phase,hypothesis:r.hypothesis,
        talent:r.talent||'',format:r.format||'',castings:lane.castings||[],formats:lane.formats||[],
        notes:lane.notes||''});});
  }else if(B.roadmap){
    B.roadmap.lanes.forEach((l,li)=>{for(let k=1;k<=(+l.concepts||1);k++)
      out.push({id:`L${li}C${k}`,d:'',c:`Concept ${k} of ${l.concepts} · Swimlane ${li+1}`,variants:+l.variants||0,
        ctp:l.ctp,segment:l.segment,angle:l.angle,funnel:l.funnel,phase:l.phase,hypothesis:l.hypothesis,
        talent:(l.castings||[]).length===1?l.castings[0]:'',format:(l.formats||[]).length===1?l.formats[0]:'',
        castings:l.castings||[],formats:l.formats||[],notes:l.notes});});
  }
  return out;
}

function ingestRef(bid){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f)return;
    const url=URL.createObjectURL(f); const img=new Image();
    img.onload=()=>{
      const MAX=900; let w=img.width,h=img.height;
      const s=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      let dataUrl; try{dataUrl=cv.toDataURL('image/jpeg',.85);}catch(e){dataUrl=cv.toDataURL();}
      URL.revokeObjectURL(url);
      B.briefWork=B.briefWork||{}; (B.briefWork[bid]=B.briefWork[bid]||{}).superRef=dataUrl;
      save(); render();
    };
    img.onerror=()=>{URL.revokeObjectURL(url); alert('Could not read that image — try a PNG/JPG/WebP/GIF.');};
    img.src=url;
  };
  inp.click();
}

  return Array.from({length:mN},(_,r)=>`${r+1}. ${w['m'+r+'i']||'[image]'}  |  ${w['m'+r+'c']||'[copy]'}`).join('\n');})()}
${(+c.variants||0)?Array.from({length:+c.variants},(_,vi)=>{const w=B.briefWork?.[c.id]||{};const vN=Math.max(1,+(w['_v'+vi]||2));
  return `\nVARIANT V${String(vi+1).padStart(2,'0')} — what changes:\n${Array.from({length:vN},(_,r)=>`- ${w['v'+vi+'r'+r+'i']||'[image]'}  |  ${w['v'+vi+'r'+r+'c']||'[copy]'}`).join('\n')}`;}).join('\n'):''}

QC & CLIENT RULES (${B.name})
${[...QC_RULES.disclaimers,...QC_RULES.copy,...QC_RULES.visual].map(x=>'- '+x).join('\n')}

BRIEF BEST PRACTICES
- Naming: RS convention, no special symbols; double-check typos.
- Copy: EXACT copy incl. punctuation, aligned to brand grammar; per-frame if known.
- Style: mark supers/captions style (+ screenshot/gif if special).
- Footage: all links + SCF shooting link; past deliveries by D#+C#; say what each shot must convey.
- Audio: VO yes/no (voice/style/tone/reference) · music yes/no + vibe.
- VFX/AI: flag at the top + visual references + UI needs.

GLOSSARY — CTP: psychological profile (client persona; the tag goes into the ad name) · Core Insight: their inner monologue · Segment: demographic group used for casting — who is on camera; psychology lives in CTPs · Angle: persuasion route · Funnel: TOFU cold / MOFU evaluating / BOFU near purchase · Phase: Explore new / Exploit validated / Amplify scale · D#/C#/V##: delivery / concept / variant (1 ad = 1 variant).`;
}
function copyAllBriefs(){
  const list=conceptList().filter(c=>(B.genBriefs||[]).includes(c.id));
  navigator.clipboard.writeText(list.map(briefTxt).join('\n\n'+'═'.repeat(60)+'\n\n'));
}

/* boot */
applyTheme(); render();
</script>
