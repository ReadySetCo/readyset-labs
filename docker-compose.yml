# Docker Compose for Brand Intelligence Scraper
# Usage: docker-compose up --build

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # These can also be set in .env file
      - DATABASE_URL=sqlite+aiosqlite:///./data/database.db
      - ENABLE_ANYTHINGLLM_SYNC=false
      - ANYTHINGLLM_API_KEY=
      - ANYTHINGLLM_URL=
    env_file:
      - ./backend/.env
    volumes:
      # Persist database
      - backend_data:/app/data
      # Persist local knowledge exports
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/knowledge_base_processed:/app/knowledge_base_processed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Vite/React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
