# Docker Compose for Brand Intelligence Scraper
# Usage: docker-compose up --build

version: '3.8'

services:
  # AnythingLLM - RAG Chat Service
  anythingllm:
    image: mintplexlabs/anythingllm:latest
    container_name: anythingllm
    ports:
      - "3001:3001"
    environment:
      - STORAGE_DIR=/app/server/storage
      - JWT_SECRET=${ANYTHINGLLM_JWT_SECRET:-change-me-in-production}
      - SERVER_PORT=3001
      # Use host machine's OpenAI/Gemini keys (passed via env_file)
    env_file:
      - ./backend/.env
    volumes:
      - anythingllm_storage:/app/server/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # These can also be set in .env file
      - DATABASE_URL=sqlite+aiosqlite:///./data/database.db
      # Point to AnythingLLM container
      - ANYTHINGLLM_URL=http://anythingllm:3001
    env_file:
      - ./backend/.env
    volumes:
      # Persist database
      - backend_data:/app/data
      # Share knowledge base with AnythingLLM
      - ./backend/knowledge_base:/app/knowledge_base
      - ./backend/knowledge_base_processed:/app/knowledge_base_processed
    depends_on:
      anythingllm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Vite/React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  anythingllm_storage:
